name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v4

      - name: Node.js を用意する
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存パッケージをインストールする
        run: npm ci

      - name: テストを実行する
        run: npm test
